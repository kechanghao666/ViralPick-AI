name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall backend scripts tests

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/assets/js/api.js
          node --check frontend/assets/js/app.js
          node --check frontend/assets/js/charts.js
          node --check frontend/assets/js/format.js
          node --check frontend/assets/js/report.js

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t viralpick-ai:ci .
